[package]
name = "aws-domain-manager"
version = "1.3.0"
description = "Desktop UI for managing AWS Route53, EC2 Security Groups, S3 Buckets, and AWS Profiles"
authors = ["sebseb7"]
edition = "2021"

[lib]
name = "aws_domain_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-types = "1"
aws-sdk-route53 = "1"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-iam = "1"
aws-sdk-sesv2 = "1"
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
