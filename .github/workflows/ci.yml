name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  build-js:
    name: Build TUI & Desktop WebView
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Cache root node_modules
        id: cache-root-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-

      - name: Install TUI dependencies
        if: steps.cache-root-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build TUI bundle
        run: npm run build

      - name: Cache desktop WebView bundle (shared across OS & releases)
        id: cache-desktop-dist
        uses: actions/cache@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ hashFiles('desktop/package-lock.json', 'desktop/index.html', 'desktop/tsconfig.json', 'desktop/vite.config.ts', 'desktop/src/**') }}

      - name: Cache desktop node_modules
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        id: cache-desktop-modules
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      - name: Install desktop frontend dependencies
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true' && steps.cache-desktop-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Cache Vite pre-bundled dependencies
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: desktop/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('desktop/package-lock.json', 'desktop/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Typecheck and build desktop WebView bundle
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: build-js
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore pre-built desktop WebView bundle
        id: restore-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ hashFiles('desktop/package-lock.json', 'desktop/index.html', 'desktop/tsconfig.json', 'desktop/vite.config.ts', 'desktop/src/**') }}
          fail-on-cache-miss: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache (per-crate Rust compilation cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git index
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
          shared-key: tauri-release-${{ matrix.platform }}
          cache-all-crates: true
          cache-on-failure: true
          save-if: true

      - name: Build Rust backend (no distribution packaging)
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
