name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-js:
    name: Build TUI & Desktop WebView
    runs-on: ubuntu-latest
    outputs:
      desktop_tree_hash: ${{ steps.desktop-tree.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute OS-independent desktop source tree hash
        id: desktop-tree
        shell: bash
        run: echo "hash=$(git rev-parse HEAD:desktop)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Cache root node_modules
        id: cache-root-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-root-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-root-modules-

      - name: Install TUI dependencies
        if: steps.cache-root-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: Build TUI bundle
        run: npm run build

      - name: Cache desktop WebView bundle (shared across OS & releases)
        id: cache-desktop-dist
        uses: actions/cache@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ steps.desktop-tree.outputs.hash }}

      - name: Cache desktop node_modules
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        id: cache-desktop-modules
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      - name: Install desktop frontend dependencies
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true' && steps.cache-desktop-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Typecheck and build desktop WebView bundle
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build

      - name: Upload desktop WebView artifact (fallback if cache save is rate-limited)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 1

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: build-js
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore pre-built desktop WebView bundle from cache
        id: restore-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ needs.build-js.outputs.desktop_tree_hash }}

      - name: Download desktop WebView artifact on cache miss
        if: steps.restore-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: desktop/dist

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo.lock (locks dependency versions & ensures rust-cache restore/save keys match)
        id: cache-cargo-lock
        uses: actions/cache@v6
        with:
          path: desktop/src-tauri/Cargo.lock
          key: cargo-lock-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Generate Cargo.lock before rust-cache if not cached
        if: steps.cache-cargo-lock.outputs.cache-hit != 'true'
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache sccache artifacts (single archive, no API rate limit)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: ${{ runner.os }}-sccache-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/src/**') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}-
            ${{ runner.os }}-sccache-

      - name: Cache Rust target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
          shared-key: tauri-release-${{ matrix.platform }}
          cache-all-crates: true
          cache-on-failure: true

      - name: Build Rust backend (no distribution packaging)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache-cache
        run: cargo build --release --manifest-path desktop/src-tauri/Cargo.toml

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
