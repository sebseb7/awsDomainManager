name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app,dmg
          - platform: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache desktop node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      - name: Install frontend dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Cache Vite pre-bundled dependencies
        uses: actions/cache@v6
        with:
          path: desktop/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('desktop/package-lock.json', 'desktop/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache (per-crate Rust compilation cache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo registry and git index
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust target artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
          shared-key: tauri-release-${{ matrix.platform }}
          cache-all-crates: true
          cache-on-failure: true
          save-if: true

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AWS Domain Manager ${{ github.ref_name }}'
          releaseBody: |
            ## AWS Domain Manager Desktop (Tauri v2)

            Native desktop application for managing AWS Route53 DNS records, EC2 Security Group inbound rules, S3 buckets & objects (with scoped IAM user creation, key revoke/recreate, multiple read keys & single write key, and QR code export), and AWS credential profiles.

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` disk image or `.app.zip` application bundle
            - **Windows (x64):** `.exe` NSIS installer
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats

      - name: Package and upload macOS .app bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_PATH=$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "AWS-Domain-Manager-macos-aarch64.app.zip"
            gh release upload "${{ github.ref_name }}" "AWS-Domain-Manager-macos-aarch64.app.zip" --clobber
          fi
