name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-frontend:
    name: Build Desktop WebView
    runs-on: ubuntu-latest
    outputs:
      desktop_tree_hash: ${{ steps.desktop-tree.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Wait for in-progress CI Build on same commit to warm [main] caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_ID=$(gh run list --workflow "ci.yml" --commit "${{ github.sha }}" --json databaseId,status --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting") | .databaseId' | head -n 1 || true)
          if [ -n "$RUN_ID" ]; then
            echo "Waiting for CI Build run #$RUN_ID on commit ${{ github.sha }} to finish warming [main] caches..."
            gh run watch "$RUN_ID" || true
          fi

      - name: Compute OS-independent desktop source tree hash
        id: desktop-tree
        shell: bash
        run: echo "hash=$(git rev-parse HEAD:desktop)" >> "$GITHUB_OUTPUT"

      - name: Restore desktop WebView bundle from [main] cache
        id: cache-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ steps.desktop-tree.outputs.hash }}

      - name: Setup Node.js 24
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore desktop node_modules from [main] cache
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        id: cache-node-modules
        uses: actions/cache/restore@v6
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      - name: Install frontend dependencies
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Typecheck and build desktop WebView bundle
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build

      - name: Upload desktop WebView artifact (fallback if cache miss)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 1

  publish-tauri:
    needs: build-frontend
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore pre-built desktop WebView bundle from [main] cache
        id: restore-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ needs.build-frontend.outputs.desktop_tree_hash }}

      - name: Download desktop WebView artifact on cache miss
        if: steps.restore-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: desktop/dist

      - name: Setup Node.js 24 (for Tauri CLI)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Tauri CLI dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Compute Cargo dependencies hash (ignoring package version bumps)
        id: cargo-deps
        shell: bash
        run: |
          DEPS_HASH=$(grep -v '^version *=' desktop/src-tauri/Cargo.toml | sha256sum | cut -d' ' -f1)
          echo "hash=$DEPS_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo.lock from [main] cache
        uses: actions/cache/restore@v6
        with:
          path: desktop/src-tauri/Cargo.lock
          key: cargo-lock-${{ steps.cargo-deps.outputs.hash }}
          restore-keys: |
            cargo-lock-

      - name: Incrementally sync Cargo.lock without upgrading locked crates
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path desktop/src-tauri/Cargo.toml > /dev/null
          HASH=$(sha256sum desktop/src-tauri/Cargo.lock | cut -d' ' -f1)
          echo "lock_hash=$HASH" >> "$GITHUB_ENV"

      - name: Restore sccache directory from [main] cache (before starting sccache daemon)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: ${{ runner.os }}-sccache-${{ env.lock_hash }}-${{ hashFiles('desktop/src-tauri/src/**') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ env.lock_hash }}-
            ${{ runner.os }}-sccache-

      - name: Setup sccache daemon with restored directory
        uses: mozilla-actions/sccache-action@v0.0.11
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache-cache
          SCCACHE_CACHE_SIZE: '5G'

      - name: Restore Rust target artifacts from [main] cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
          shared-key: tauri-release-${{ matrix.platform }}
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache-cache
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AWS Domain Manager ${{ github.ref_name }}'
          releaseBody: |
            ## AWS Domain Manager Desktop ${{ github.ref_name }} (Tauri v2)

            Native desktop application for managing AWS Route53 DNS records, EC2 Instances & Elastic IPs (with instance state, public/private/Elastic IPs, start/stop/reboot, persistent Reboot Lock protection, and Elastic IP allocation/association), EC2 Security Group inbound rules, S3 buckets & objects (with scoped IAM user creation, key revoke/recreate, multiple read keys & single write key, and QR code export), Amazon SES identities (domains & email addresses with Route53 DKIM/DMARC/inbound MX publishing, email verification resend, per-email SMTP sender keys with QR code export, and integrated SMTP send tester), and AWS credential profiles.

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` disk image
            - **Windows (x64):** `.exe` NSIS installer
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.ci.conf.json --bundles ${{ matrix.bundles }}

      - name: Show sccache statistics and stop daemon
        if: always()
        shell: bash
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache-cache
        run: |
          sccache --show-stats || true
          sccache --stop-server || true
