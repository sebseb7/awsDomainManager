name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-frontend:
    name: Build Desktop WebView
    runs-on: ubuntu-latest
    outputs:
      desktop_tree_hash: ${{ steps.desktop-tree.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute OS-independent desktop source tree hash
        id: desktop-tree
        shell: bash
        run: echo "hash=$(git rev-parse HEAD:desktop)" >> "$GITHUB_OUTPUT"

      - name: Restore desktop WebView bundle from [main] cache
        id: cache-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ steps.desktop-tree.outputs.hash }}

      - name: Setup Node.js 24
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore desktop node_modules from [main] cache
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        id: cache-node-modules
        uses: actions/cache/restore@v6
        with:
          path: desktop/node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      - name: Install frontend dependencies
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Typecheck and build desktop WebView bundle
        if: steps.cache-desktop-dist.outputs.cache-hit != 'true'
        working-directory: desktop
        run: npm run build

      - name: Upload desktop WebView artifact (fallback if cache miss)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: desktop/dist
          retention-days: 1

  publish-tauri:
    needs: build-frontend
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore pre-built desktop WebView bundle from [main] cache
        id: restore-desktop-dist
        uses: actions/cache/restore@v6
        with:
          path: desktop/dist
          key: desktop-dist-${{ needs.build-frontend.outputs.desktop_tree_hash }}

      - name: Download desktop WebView artifact on cache miss
        if: steps.restore-desktop-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: desktop/dist

      - name: Setup Node.js 24 (for Tauri CLI)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Tauri CLI dependencies
        working-directory: desktop
        run: npm ci --prefer-offline

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo.lock from [main] cache (ensures rust-cache restore key matches save key)
        id: cache-cargo-lock
        uses: actions/cache/restore@v6
        with:
          path: desktop/src-tauri/Cargo.lock
          key: cargo-lock-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Generate Cargo.lock before rust-cache if not cached
        if: steps.cache-cargo-lock.outputs.cache-hit != 'true'
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore sccache artifacts from [main] cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sccache-cache
          key: ${{ runner.os }}-sccache-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/src/**') }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}-
            ${{ runner.os }}-sccache-

      - name: Restore Rust target artifacts from [main] cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
          shared-key: tauri-release-${{ matrix.platform }}
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          SCCACHE_DIR: ${{ runner.temp }}/sccache-cache
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AWS Domain Manager ${{ github.ref_name }}'
          releaseBody: |
            ## AWS Domain Manager Desktop (Tauri v2)

            Native desktop application for managing AWS Route53 DNS records, EC2 Security Group inbound rules, S3 buckets & objects (with scoped IAM user creation, key revoke/recreate, multiple read keys & single write key, and QR code export), Amazon SES identities (domains & email addresses with Route53 DKIM/DMARC/inbound MX publishing, email verification resend, per-email SMTP sender keys with QR code export, and integrated SMTP send tester), and AWS credential profiles.

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` disk image
            - **Windows (x64):** `.exe` NSIS installer
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.ci.conf.json --bundles ${{ matrix.bundles }}

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats
